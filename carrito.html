<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - FIME Store</title>
<link rel="icon" href="https://i.postimg.cc/P5FWnG14/fimeblanco.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#102A54;
    --blue:#1E4CA8;
    --yellow:#F4B400;
    --paper:#FBFBF9;
    --ink:#0E1B33;
    --slate:#5C6B84;
  }
  *{box-sizing:border-box;}
  body{font-family:'Space Grotesk',sans-serif; background:var(--paper); color:var(--ink);}
  .font-display{font-family:'Fraunces',serif;}
  .nav-link{position:relative;}
  .nav-link::after{content:"";position:absolute;left:0;bottom:-4px;width:0;height:2px;background:var(--yellow);transition:width .3s ease;}
  .nav-link:hover::after{width:100%;}
</style>
</head>
<body class="antialiased">

<!-- NAVBAR -->
<header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md border-b border-white/10 shadow-lg" style="background-color: rgba(16, 42, 84, 0.85);">
  <nav class="max-w-7xl mx-auto flex items-center justify-between px-5 md:px-8 py-4">
    <a href="index.html" class="flex items-center">
      <img src="https://i.postimg.cc/P5FWnG14/fimeblanco.png" alt="Logo FIME" class="h-12 w-auto object-contain">
    </a>
    
    <div class="hidden md:flex items-center gap-8 text-sm text-white/90 font-medium">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="conocenos.html" class="nav-link">Conócenos</a>
      <a href="tienda.html" class="nav-link text-[var(--yellow)] font-semibold">FIME Store</a>
      <a href="servicios.html" class="nav-link">Servicios</a>
      <a href="contacto.html" class="nav-link">Contacto</a>
    </div>

    <div class="flex items-center gap-4">
      <a href="tienda.html" class="text-white hover:text-[var(--yellow)] transition font-medium text-sm">
        Seguir Comprando
      </a>
    </div>
  </nav>
</header>

<!-- CONTENEDOR DEL CARRITO -->
<main class="max-w-7xl mx-auto px-5 md:px-8 pt-32 pb-24 min-h-[70vh]">
  
  <h1 class="font-display text-3xl md:text-4xl font-semibold text-[var(--blue-deep)] mb-8 border-b border-black/10 pb-4">
    Tu Carrito de Apartado
  </h1>

  <div class="grid lg:grid-cols-12 gap-10 items-start">
    
    <!-- LISTA DE PRODUCTOS -->
    <div class="lg:col-span-8 space-y-4" id="cart-items-container">
      <!-- Aquí se van a inyectar los productos con JavaScript -->
      <p class="text-[var(--slate)]" id="empty-msg">Cargando carrito...</p>
    </div>

    <!-- RESUMEN DEL PEDIDO -->
    <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-lg border border-black/5 sticky top-32">
      <h2 class="font-bold text-lg mb-4 text-[var(--ink)]">Resumen del Pedido</h2>
      
      <div class="flex justify-between mb-2 text-sm text-[var(--slate)]">
        <span>Subtotal</span>
        <span id="subtotal-price">$0.00 MXN</span>
      </div>
      <div class="flex justify-between mb-4 text-sm text-[var(--slate)]">
        <span>Envío / Entrega</span>
        <span>En Campus (Gratis)</span>
      </div>
      
      <div class="border-t border-black/10 pt-4 mb-6 flex justify-between items-center">
        <span class="font-bold text-[var(--ink)] text-lg">Total</span>
        <span class="font-bold text-[var(--blue-deep)] text-2xl" id="total-price">$0.00 MXN</span>
      </div>

      <button onclick="enviarPedidoPorWhatsApp()" id="btn-checkout" class="w-full bg-[var(--blue-deep)] text-white font-bold py-3.5 rounded-xl hover:bg-[var(--blue)] transition flex items-center justify-center gap-2 mb-3">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.305-.885-.653-1.482-1.459-1.656-1.756-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        Hacer pedido por WhatsApp
      </button>
      <p class="text-xs text-center text-[var(--slate)]">El pago se acuerda al momento de la entrega en FIME.</p>
    </div>

  </div>
</main>

<!-- SCRIPT DEL CARRITO -->
<script>
  // Cargar carrito desde LocalStorage
  let carrito = JSON.parse(localStorage.getItem('fimeCart')) || [];

  function renderizarCarrito() {
    const container = document.getElementById('cart-items-container');
    const subtotalEl = document.getElementById('subtotal-price');
    const totalEl = document.getElementById('total-price');
    const btnCheckout = document.getElementById('btn-checkout');

    // Si el carrito está vacío
    if(carrito.length === 0) {
      container.innerHTML = `
        <div class="bg-white p-10 rounded-2xl border border-black/5 text-center shadow-sm">
          <p class="text-lg text-[var(--slate)] font-medium mb-4">Tu carrito está vacío, Inge.</p>
          <a href="tienda.html" class="inline-block bg-[var(--yellow)] text-[var(--blue-deep)] font-semibold px-6 py-2.5 rounded-full hover:brightness-105">Ir a la tienda</a>
        </div>
      `;
      subtotalEl.innerText = "$0.00 MXN";
      totalEl.innerText = "$0.00 MXN";
      btnCheckout.disabled = true;
      btnCheckout.classList.add('opacity-50', 'cursor-not-allowed');
      return;
    }

    // Si hay cosas, las pintamos
    let html = '';
    let total = 0;

    carrito.forEach((item, index) => {
      total += item.precio * item.cantidad;
      html += `
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-black/5 flex gap-4 md:gap-6 items-center">
          <img src="${item.imagen}" alt="${item.nombre}" class="w-20 h-20 md:w-24 md:h-24 object-contain rounded-lg bg-gray-100 border p-1">
          <div class="flex-grow">
            <h3 class="font-display font-semibold text-[var(--ink)] text-base md:text-lg">${item.nombre}</h3>
            <p class="text-xs text-[var(--slate)] mb-2">Talla: <span class="font-bold">${item.talla}</span> | Color: <span class="font-bold">${item.color}</span></p>
            <p class="font-bold text-[var(--blue-deep)]">$${item.precio} MXN <span class="text-xs font-normal text-gray-500">x ${item.cantidad}</span></p>
          </div>
          <button onclick="eliminarDelCarrito(${index})" class="text-red-500 hover:text-red-700 p-2" title="Eliminar artículo">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      `;
    });

    container.innerHTML = html;
    subtotalEl.innerText = `$${total}.00 MXN`;
    totalEl.innerText = `$${total}.00 MXN`;
    btnCheckout.disabled = false;
    btnCheckout.classList.remove('opacity-50', 'cursor-not-allowed');
  }

  // Eliminar un producto
  function eliminarDelCarrito(index) {
    carrito.splice(index, 1);
    localStorage.setItem('fimeCart', JSON.stringify(carrito));
    renderizarCarrito();
  }

  // Mandar WhatsApp (Cambia el 52866XXXXXXX por tu número real)
  function enviarPedidoPorWhatsApp() {
    let telefono = "528661234567"; // AQUI PON EL WHATSAPP DONDE RECIBEN PEDIDOS
    let total = 0;
    
    let mensaje = "¡Qué onda! Me interesa apartar lo siguiente de la FIME Store:%0A%0A";
    
    carrito.forEach(item => {
      total += item.precio * item.cantidad;
      mensaje += `📌 *${item.nombre}*%0A`;
      mensaje += `- Talla: ${item.talla}%0A`;
      mensaje += `- Color: ${item.color}%0A`;
      mensaje += `- Cantidad: ${item.cantidad}%0A`;
      mensaje += `- Subtotal: $${item.precio * item.cantidad} MXN%0A%0A`;
    });
    
    mensaje += `💰 *TOTAL A PAGAR: $${total} MXN*%0A%0A`;
    mensaje += "Quedo al pendiente para coordinar la entrega en FIME. ¡Saludos!";

    let url = `https://wa.me/${telefono}?text=${mensaje}`;
    window.open(url, '_blank');
  }

  // Iniciar
  renderizarCarrito();
</script>

</body>
</html>
